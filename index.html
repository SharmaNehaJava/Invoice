
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="CC Equipment AI — equipment quoting and sales management."
    />

    <title>CC Equipment AI</title>

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem("cc.theme")) === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
